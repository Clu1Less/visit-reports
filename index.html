<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Visit Reports">
<title>Home Visit Reports</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0F8577">
<style>
  :root{
    color-scheme:light;
    --bg:#F2F2F7; --card:#FFFFFF; --separator:#E5E5EA;
    --ink:#1C1C1E; --ink-soft:#8A8A8E; --fill:#EFEFF2;
    --accent:#0F8577; --accent-soft:#D9F0EB;
    --danger:#FF3B30; --danger-soft:#FFEBEA;
    --topbar-bg:rgba(242,242,247,.85);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);

    --space-1:4px;  --space-2:8px;  --space-3:12px; --space-4:16px;
    --space-5:20px; --space-6:24px; --space-8:32px;

    --text-scale:1;
    --text-xs:calc(13px * var(--text-scale));  --text-sm:calc(14px * var(--text-scale));
    --text-base:calc(16px * var(--text-scale)); --text-md:calc(17px * var(--text-scale));
    --text-lg:calc(18px * var(--text-scale));   --text-xl:calc(22px * var(--text-scale));
    --text-2xl:calc(28px * var(--text-scale));

    --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;

    --ease-snap:cubic-bezier(.2,.8,.2,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#000000; --card:#1C1C1E; --separator:#38383A;
      --ink:#F2F2F7; --ink-soft:#98989D; --fill:#2C2C2E;
      --accent:#2FB8A6; --accent-soft:#123A34;
      --danger:#FF453A; --danger-soft:#3A1512;
      --topbar-bg:rgba(0,0,0,.75);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#000000; --card:#1C1C1E; --separator:#38383A;
    --ink:#F2F2F7; --ink-soft:#98989D; --fill:#2C2C2E;
    --accent:#2FB8A6; --accent-soft:#123A34;
    --danger:#FF453A; --danger-soft:#3A1512;
    --topbar-bg:rgba(0,0,0,.75);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;font-weight:400;
    padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
  }
  #app{max-width:940px;margin:0 auto;padding:0 var(--space-4) var(--space-8);}

  .topbar{
    position:sticky;top:var(--safe-top);z-index:5;
    background:var(--topbar-bg);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    padding:var(--space-3) 0;border-bottom:1px solid var(--separator);
    margin:0 calc(var(--space-4) * -1) var(--space-4);
  }
  .topbar-inner{padding:0 var(--space-4);}
  .topbar-row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);}
  .large-title{font-size:var(--text-2xl);font-weight:600;margin:var(--space-1) 0 0;letter-spacing:-.3px;line-height:1.15;}
  .topbar-sub{font-size:var(--text-sm);color:var(--ink-soft);margin-top:3px;font-weight:400;}
  .btn-back{background:none;border:none;color:var(--accent);font-size:var(--text-xl);font-weight:500;
    padding:14px 32px 14px 8px;margin:-10px 0 0 -8px;min-height:48px;display:block;}
  .btn-back:active{opacity:.5;}

  .search-inline{flex:1;border:none;background:var(--fill);border-radius:var(--radius-sm);
    padding:var(--space-3) var(--space-4);font-size:var(--text-md);color:var(--ink);font-weight:400;min-width:0;}

  .toolbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4);gap:var(--space-3);}
  .toolbar-left,.toolbar-right{display:flex;align-items:center;gap:var(--space-2);}

  button{font-family:inherit;cursor:pointer;transition:transform .12s var(--ease-snap),opacity .12s ease,background-color .12s ease;}
  button:active{transform:scale(.96);}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button[disabled]{pointer-events:none;}

  .btn-primary{background:var(--accent);color:#fff;font-weight:600;font-size:var(--text-lg);padding:var(--space-4) var(--space-5);border:none;border-radius:var(--radius-md);}
  .btn-primary:active{opacity:.85;}
  .btn-primary.full-width{width:100%;}

  .btn-fill{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;
    border:none;border-radius:var(--radius-md);padding:var(--space-3) var(--space-5);
    font-size:var(--text-base);font-weight:600;}
  .btn-fill:active{opacity:.85;}

  .btn-chip{display:inline-flex;align-items:center;gap:7px;background:var(--fill);color:var(--ink);
    border:none;border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);font-weight:600;}
  .btn-chip:active{opacity:.6;}
  .btn-chip.accent{background:var(--accent-soft);color:var(--accent);}
  .btn-chip.accent.sent{background:var(--fill);color:var(--ink-soft);}
  .btn-chip.danger{background:var(--danger-soft);color:var(--danger);}

  .btn-pill{background:var(--accent-soft);color:var(--accent);border:none;border-radius:var(--radius-pill);
    padding:var(--space-3) var(--space-5);font-size:var(--text-sm);font-weight:600;display:inline-flex;align-items:center;}
  .btn-pill:active{opacity:.65;}

  .btn-square{background:rgba(120,120,128,.16);border:none;color:var(--accent);
    width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:var(--radius-md);padding:0;flex-shrink:0;}
  .btn-square:active{opacity:.55;}

  .section-label{font-size:var(--text-base);font-weight:600;color:var(--ink-soft);margin:var(--space-6) var(--space-1) var(--space-2);}
  .section-label:first-of-type{margin-top:var(--space-1);}

  .card{background:var(--card);border-radius:var(--radius-lg);padding:var(--space-4);margin-bottom:var(--space-2);}
  .card.quick-ref{border:1px solid var(--accent-soft);padding:var(--space-5);margin-bottom:var(--space-4);}
  .card.quick-ref h2{font-size:var(--text-xl);font-weight:600;margin:0 0 var(--space-4);}
  .qr-item{margin-bottom:var(--space-4);}
  .qr-item:last-child{margin-bottom:0;}
  .qr-label{display:block;font-size:var(--text-xs);font-weight:600;color:var(--ink-soft);margin-bottom:var(--space-1);}
  .qr-item p{margin:0;font-size:var(--text-base);line-height:1.45;font-weight:400;}

  .field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-4);}
  .field{display:flex;flex-direction:column;gap:var(--space-2);min-width:0;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:var(--text-sm);font-weight:500;color:var(--ink-soft);}
  .field input,.field textarea{
    font-family:inherit;font-size:var(--text-md);color:var(--ink);font-weight:400;
    border:none;border-radius:var(--radius-sm);padding:var(--space-4);background:var(--fill);width:100%;
  }
  .field textarea{resize:none;overflow:hidden;min-height:50px;line-height:1.45;}
  .field-invalid{box-shadow:0 0 0 2px var(--danger) inset;}
  .time-row{display:flex;gap:var(--space-2);}
  .time-row input{flex:1;}
  .time-row button{flex-shrink:0;background:var(--accent-soft);color:var(--accent);border:none;
    border-radius:var(--radius-sm);padding:0 var(--space-4);font-size:var(--text-sm);font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;}
  .time-row button:active{opacity:.6;}
  .bp-row{display:flex;align-items:center;gap:var(--space-2);}
  .bp-row input{flex:1;}
  .bp-row span{color:var(--ink-soft);}

  input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;min-height:50px;margin:0;overflow:hidden;}
  .field-grid{grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}

  .empty-state{border:1px dashed var(--separator);border-radius:var(--radius-lg);padding:var(--space-8) var(--space-4);text-align:center;color:var(--ink-soft);font-size:var(--text-base);}

  .grouped-list{background:var(--card);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-4);}
  .row{position:relative;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4);}
  .row:not(:last-child)::after{content:"";position:absolute;left:var(--space-4);right:0;bottom:0;height:1px;background:var(--separator);}
  .row.has-avatar:not(:last-child)::after{left:70px;}
  .row:active{background:var(--fill);}
  .avatar{width:40px;height:40px;border-radius:var(--radius-sm);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:var(--text-md);flex-shrink:0;}
  .row-main{flex:1;min-width:0;}
  .row-title{font-size:var(--text-md);font-weight:500;}
  .row-sub{font-size:var(--text-sm);color:var(--ink-soft);margin-top:2px;}
  .row-sub.sent{color:var(--accent);font-weight:600;}
  .row-actions{display:flex;gap:var(--space-2);flex-shrink:0;}
  .chevron{color:#98989D;font-size:var(--text-xl);flex-shrink:0;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0 var(--space-2);}
  @media (min-width:600px){.overlay{align-items:center;}}

  @keyframes sheet-in{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  .modal-card{background:var(--card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    padding:var(--space-5) var(--space-4) calc(var(--space-5) + var(--safe-bottom));width:100%;max-width:480px;
    animation:sheet-in .24s var(--ease-spring);}
  @media (min-width:600px){.modal-card{border-radius:var(--radius-lg);}}
  .modal-card h2{margin:0 0 var(--space-4);font-size:var(--text-xl);font-weight:600;text-align:center;}
  .modal-card .field{margin-bottom:var(--space-4);}

  .segmented{display:flex;background:var(--fill);border-radius:var(--radius-sm);padding:3px;gap:2px;}
  .seg-btn{flex:1;background:none;border:none;padding:var(--space-3);border-radius:6px;font-size:var(--text-sm);font-weight:600;color:var(--ink-soft);}
  .seg-btn.active{background:var(--card);color:var(--ink);}

  .sheet{width:100%;max-width:420px;padding-bottom:calc(var(--space-2) + var(--safe-bottom));animation:sheet-in .24s var(--ease-spring);}
  .sheet-card{background:var(--card);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-2);}
  .sheet-title{padding:var(--space-3) var(--space-4) 2px;font-size:var(--text-sm);font-weight:600;color:var(--ink-soft);text-align:center;}
  .sheet-sub{padding:0 var(--space-4) var(--space-3);font-size:var(--text-sm);color:var(--ink-soft);text-align:center;border-bottom:1px solid var(--separator);}
  .sheet-btn{display:block;width:100%;background:none;border:none;padding:var(--space-4);font-size:var(--text-lg);text-align:center;}
  .sheet-btn:active{background:var(--fill);}
  .sheet-btn.destructive{color:var(--danger);font-weight:500;}
  .sheet-btn.cancel{color:var(--accent);font-weight:600;}

  @media (max-width:520px){
    .large-title{font-size:var(--text-xl);}
    .field-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var DB_NAME = "nursingVisitDB";
  var ICON_GEAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"></path></svg>';
  var ICON_MAIL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px;"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>';
  var ICON_MAIL_SM = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>';
  var ICON_TRASH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
  var ICON_PLUS_SM = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>';
  var ICON_MAP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3-6-3"></path><path d="M9 7v13"></path><path d="M15 4v13"></path></svg>';

  var AVATAR_COLORS = ["#12897A","#5B4FCF","#B23B72","#CC7A1A","#1F6FBF","#5C8A1F","#C23B5A","#3D5FA6","#B8860B","#159C7A","#7A3DC2","#C2492E"];
  var TEXT_SCALES = { small:0.9, "default":1, large:1.15 };

  var SECTIONS = [
    { id:"header", title:"Visit details", fields:[
      { key:"date", label:"Date", type:"date" },
      { key:"name", label:"Name", type:"text" },
      { key:"dob", label:"Date of birth", type:"date-text" },
      { key:"address", label:"Address", type:"text", full:true, mapButton:true },
      { key:"clinician", label:"Clinician", type:"text" },
      { key:"timeIn", label:"Time in", type:"time", nowButton:true },
      { key:"timeOut", label:"Time out", type:"time", nowButton:true }
    ]},
    { id:"vitals", title:"Vital signs", fields:[
      { key:"bp", label:"Blood pressure", type:"bp", unit:"mmHg" },
      { key:"heartRate", label:"Heart rate", type:"number", unit:"bpm" },
      { key:"respRate", label:"Respiratory rate", type:"number", unit:"breaths/min" },
      { key:"spo2", label:"Oxygen Saturation (SPO2)", type:"number", unit:"%" },
      { key:"temperature", label:"Temperature", type:"number", unit:"\u00b0C", step:"0.1" },
      { key:"bloodGlucose", label:"Blood glucose level", type:"number", unit:"mmol/L", step:"0.1" }
    ]},
    { id:"history", title:"History", fields:[
      { key:"pastMedicalHistory", label:"Past medical history", type:"textarea", full:true },
      { key:"medications", label:"Medications", type:"textarea", full:true },
      { key:"allergies", label:"Allergies", type:"textarea", full:true }
    ]},
    { id:"assessment", title:"Assessment", fields:[
      { key:"cns", label:"Central Nervous System", type:"textarea", full:true },
      { key:"cvs", label:"Cardiovascular System", type:"textarea", full:true },
      { key:"resp", label:"Respiratory System", type:"textarea", full:true },
      { key:"git", label:"Gastrointestinal Tract", type:"textarea", full:true },
      { key:"skin", label:"Skin", type:"textarea", full:true },
      { key:"continence", label:"Continence", type:"textarea", full:true },
      { key:"hygiene", label:"Hygiene", type:"textarea", full:true },
      { key:"nutrition", label:"Nutrition", type:"textarea", full:true },
      { key:"mobilityPain", label:"Mobility & pain", type:"textarea", full:true },
      { key:"mentalHealth", label:"Mental health", type:"textarea", full:true },
      { key:"social", label:"Social", type:"textarea", full:true }
    ]},
    { id:"environment", title:"Environment", single:true, fields:[
      { key:"environment", label:"Environment", type:"textarea", full:true, noLabel:true }
    ]},
    { id:"plan", title:"Plan", single:true, fields:[
      { key:"plan", label:"Plan", type:"textarea", full:true, noLabel:true }
    ]}
  ];

  var CARRY_FORWARD = ["name","address","clinician","dob","medications","allergies","pastMedicalHistory"];

  var state = {
    view:{ type:"clients" },
    reports: [],
    settings: { email1:"", email2:"", theme:"system", textSize:"default" },
    settingsOpen:false,
    confirmDeleteId:null,
    search:{ text:"" }
  };

  var db = null, storageMode = "idb", persistState = null;

  function initStorage(done){
    try{ if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().then(function(ok){ persistState = ok; }); } }catch(e){}
    if(!window.indexedDB){ storageMode="local"; done(); return; }
    try{
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(e){
        var d = e.target.result;
        if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      };
      req.onsuccess = function(e){ db = e.target.result; storageMode="idb"; done(); };
      req.onerror = function(){ storageMode="local"; done(); };
    }catch(err){ storageMode="local"; done(); }
  }
  function storeGet(key, cb){
    if(storageMode==="idb"){
      try{
        var tx = db.transaction("kv","readonly").objectStore("kv").get(key);
        tx.onsuccess = function(){
          if(tx.result!==undefined){ cb(tx.result); return; }
          try{ var raw2=localStorage.getItem(key); cb(raw2?JSON.parse(raw2):null); }catch(e){ cb(null); }
        };
        tx.onerror = function(){ cb(null); };
      }catch(e){ cb(null); }
    } else {
      try{ var raw=localStorage.getItem(key); cb(raw?JSON.parse(raw):null); }catch(e){ cb(null); }
    }
  }
  function storeSet(key, value){
    if(storageMode==="idb"){
      try{ db.transaction("kv","readwrite").objectStore("kv").put(value, key); }catch(e){}
      try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
    } else {
      try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
    }
  }
  function saveReports(){ storeSet("reports", state.reports); }

  function needsBackup(){
    if(!state.reports.length) return false;
    var lb = state.settings.lastBackup || 0;
    return state.reports.some(function(r){ return (r.updatedAt||r.createdAt||0) > lb; });
  }
  function refreshIfOnList(){ if(state.view && state.view.type==="clients" && !state.settingsOpen && !state.confirmDeleteId){ render(); } }
  window.addEventListener("online", refreshIfOnList);
  window.addEventListener("offline", refreshIfOnList);

  function backupNow(){
    var clean = state.reports.map(function(r){ var c=JSON.parse(JSON.stringify(r)); delete c.baseline; return c; });
    var payload = JSON.stringify({ app:"home-visit-reports", version:1, savedAt:new Date().toISOString(), reports:clean, settings:state.settings });
    var name = "visit-reports-backup.json";
    function markDone(){ state.settings.lastBackup = Date.now(); saveSettings(); render(); }
    try{
      var file = new File([payload], name, {type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file]}).then(markDone).catch(function(){});
        return;
      }
      var a = document.createElement("a");
      a.href = URL.createObjectURL(file); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      markDone();
    }catch(e){ alert("Backup failed. Try again."); }
  }
  function restoreFrom(file){
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var obj = JSON.parse(fr.result);
        if(!obj || obj.app!=="home-visit-reports" || !Array.isArray(obj.reports)) throw new Error("bad");
        var have = {}; state.reports.forEach(function(r){ have[r.id]=true; });
        var added = 0;
        obj.reports.forEach(function(r){ if(r && r.id && !have[r.id]){ state.reports.push(r); added++; } });
        if(obj.settings){
          if(!state.settings.email1 && obj.settings.email1) state.settings.email1 = obj.settings.email1;
          if(!state.settings.email2 && obj.settings.email2) state.settings.email2 = obj.settings.email2;
          saveSettings();
        }
        saveReports(); render();
        alert("Restored "+added+" report"+(added===1?"":"s")+". Existing reports stayed as they were.");
      }catch(e){ alert("That file is not a backup from this app."); }
    };
    fr.readAsText(file);
  }

  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function nowHM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
  function pad(n){ return n<10?"0"+n:""+n; }
  function esc(v){
    return (v===undefined||v===null?"":String(v))
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function newId(){ return Date.now()+"-"+Math.random().toString(36).slice(2,8); }
  function findReport(id){
    for(var i=0;i<state.reports.length;i++){ if(state.reports[i].id===id) return state.reports[i]; }
    return null;
  }
  function formatDate(iso){
    if(!iso) return "";
    var parts = iso.split("-");
    if(parts.length!==3) return iso;
    return parts[2]+"/"+parts[1]+"/"+parts[0];
  }
  function keyForName(name){ return (name||"").trim().toLowerCase(); }
  function clientKeyFor(r){ return keyForName(r.data.name) || ("unnamed-"+r.id); }

  function reportsForClientKey(key){
    return state.reports.filter(function(r){ return clientKeyFor(r)===key; })
      .sort(function(a,b){ return b.updatedAt-a.updatedAt; });
  }
  function getLatestValue(reports, field){
    for(var i=0;i<reports.length;i++){ if(reports[i].data[field]) return reports[i].data[field]; }
    return "";
  }
  function groupReports(list){
    var groups={}, order=[];
    list.forEach(function(r){
      var k = clientKeyFor(r);
      if(!groups[k]){ groups[k]={key:k,name:r.data.name||"Unnamed client",reports:[],latest:0}; order.push(k); }
      groups[k].reports.push(r);
      if(r.updatedAt>groups[k].latest) groups[k].latest=r.updatedAt;
    });
    var arr = order.map(function(k){ return groups[k]; });
    arr.sort(function(a,b){ return b.latest-a.latest; });
    arr.forEach(function(g){ g.reports.sort(function(a,b){ return b.updatedAt-a.updatedAt; }); });
    return arr;
  }
  function filterReportsForClients(list){
    var q=(state.search.text||"").trim().toLowerCase();
    return list.filter(function(r){ return !q || (r.data.name||"").toLowerCase().indexOf(q)!==-1; });
  }

  function isReportUnchanged(r){
    if(typeof r.baseline !== "string") return false;
    return JSON.stringify(r.data) === r.baseline;
  }

  function isFormComplete(r){
    var d = r.data;
    for(var si=0; si<SECTIONS.length; si++){
      var fields = SECTIONS[si].fields;
      for(var fi=0; fi<fields.length; fi++){
        var f = fields[fi];
        if(f.type==="bp"){
          if(!d.bpSystolic || !d.bpDiastolic) return false;
        } else if(f.type==="date-text"){
          if(!d[f.key] || !isValidDateText(d[f.key])) return false;
        } else {
          if(!d[f.key]) return false;
        }
      }
    }
    return true;
  }

  /* FNV-1a: small changes in the input scatter widely, so similar names land on very different colours */
  function hashStr(s){
    var h = 0x811c9dc5;
    for(var i=0;i<s.length;i++){
      h ^= s.charCodeAt(i);
      h = (h * 0x01000193) >>> 0;
    }
    return h;
  }
  function colorForClient(key){ return AVATAR_COLORS[hashStr(key) % AVATAR_COLORS.length]; }

  function formatDateTextInput(raw){
    var digits = raw.replace(/[^0-9]/g,"").slice(0,8);
    var day = digits.slice(0,2), month = digits.slice(2,4), year = digits.slice(4,8);
    var out = day;
    if(digits.length>2) out += "/"+month;
    if(digits.length>4) out += "/"+year;
    return out;
  }
  function ageText(v){
    if(!v || !isValidDateText(v)) return "";
    var p=v.split("/"), b=new Date(+p[2],+p[1]-1,+p[0]), n=new Date();
    if(b>n) return "";
    var yrs=n.getFullYear()-b.getFullYear(), m=n.getMonth()-b.getMonth();
    if(m<0 || (m===0 && n.getDate()<b.getDate())) yrs--;
    if(yrs<1){
      var mo=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();
      if(n.getDate()<b.getDate()) mo--;
      return "Age "+Math.max(mo,0)+" mo";
    }
    return "Age "+yrs;
  }
  function isValidDateText(v){
    var m = /^([0-9]{2})\/([0-9]{2})\/([0-9]{4})$/.exec(v);
    if(!m) return false;
    var day=+m[1], month=+m[2], year=+m[3];
    if(month<1||month>12) return false;
    if(year<1900||year>2100) return false;
    var daysInMonth = new Date(year, month, 0).getDate();
    if(day<1||day>daysInMonth) return false;
    return true;
  }

  function renderField(f, data){
    var val = data[f.key];
    var cls = "field"+(f.full?" full":"");
    var label = f.label + (f.unit ? " ("+f.unit+")" : "");

    if(f.type==="bp"){
      return '<div class="'+cls+'"><label>'+esc(label)+'</label>'+
        '<div class="bp-row">'+
          '<input type="number" inputmode="numeric" placeholder="Systolic" data-field="bpSystolic" value="'+esc(data.bpSystolic)+'">'+
          '<span>/</span>'+
          '<input type="number" inputmode="numeric" placeholder="Diastolic" data-field="bpDiastolic" value="'+esc(data.bpDiastolic)+'">'+
        '</div></div>';
    }
    if(f.type==="textarea"){
      var showLabel = f.noLabel ? "" : '<label>'+esc(label)+'</label>';
      return '<div class="'+cls+'">'+showLabel+'<textarea data-field="'+f.key+'" rows="1">'+esc(val)+'</textarea></div>';
    }
    if(f.type==="time"){
      return '<div class="'+cls+'"><label>'+esc(label)+'</label><div class="time-row">'+
        '<input type="text" inputmode="numeric" autocomplete="off" placeholder="HH:MM" maxlength="5" data-mask="time" data-field="'+f.key+'" value="'+esc(val)+'">'+
        (f.nowButton ? '<button data-action="time-now" data-field="'+f.key+'">Now</button>' : '')+
        '</div></div>';
    }
    if(f.type==="number"){
      return '<div class="'+cls+'"><label>'+esc(label)+'</label>'+
        '<input type="number" inputmode="decimal" step="'+(f.step||"1")+'" data-field="'+f.key+'" value="'+esc(val)+'"></div>';
    }
    if(f.type==="date-text"){
      var agv = ageText(val);
      return '<div class="'+cls+'"><label>'+esc(label)+' <span data-age-for="'+f.key+'" style="color:var(--accent);font-weight:600;">'+(agv?'\u00b7 '+agv:'')+'</span></label>'+
        '<input type="text" inputmode="numeric" autocomplete="off" placeholder="DD/MM/YYYY" maxlength="10" data-mask="date" data-field="'+f.key+'" value="'+esc(val)+'"></div>';
    }
    if(f.type==="text" && f.mapButton){
      return '<div class="'+cls+'"><label>'+esc(label)+'</label><div class="time-row">'+
        '<input type="text" data-field="'+f.key+'" value="'+esc(val)+'">'+
        '<button data-action="open-map" data-field="'+f.key+'" aria-label="Open in Maps">'+ICON_MAP+'</button>'+
        '</div></div>';
    }
    return '<div class="'+cls+'"><label>'+esc(label)+'</label>'+
      '<input type="'+f.type+'" data-field="'+f.key+'" value="'+esc(val)+'"></div>';
  }

  function reportToText(r){
    var d=r.data, lines=[];
    lines.push("HOME VISIT REPORT","");
    SECTIONS.forEach(function(section){
      lines.push(section.title.toUpperCase());
      section.fields.forEach(function(f){
        if(f.type==="bp"){
          var sys=d.bpSystolic||"", dia=d.bpDiastolic||"";
          lines.push("Blood pressure: "+(sys||dia? sys+"/"+dia+" mmHg" : ""));
        } else if(section.single){
          lines.push((d[f.key]||"").toString() || "(none noted)");
        } else {
          var unit=f.unit?" "+f.unit:"";
          var v=d[f.key];
          if(f.key==="date") v=formatDate(v);
          if(f.key==="dob" && ageText(v)) v = v+" ("+ageText(v)+")";
          lines.push(f.label+": "+(v||"")+(v&&f.unit?unit:""));
        }
      });
      lines.push("");
    });
    return lines.join("\n");
  }

  function mailReport(id){
    var r = findReport(id);
    if(!r) return;
    var s = state.settings;
    var to = [s.email1, s.email2].filter(Boolean).join(",");
    if(!to){
      state.settingsOpen = true;
      render();
      alert("Add your recipient emails first, then tap Mail again.");
      return;
    }
    var subject = "Home Visit Report - "+(r.data.name||"Unnamed")+" - "+formatDate(r.data.date||"");
    var body = reportToText(r);
    window.location.href = "mailto:"+to+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
    r.sent = true;
    r.updatedAt = Date.now();
    saveReports();
  }

  function mailAllUnsent(){
    var unsent = state.reports.filter(function(r){ return !r.sent; });
    if(unsent.length===0) return;
    var s = state.settings;
    var to = [s.email1, s.email2].filter(Boolean).join(",");
    if(!to){
      state.settingsOpen = true;
      render();
      alert("Add your recipient emails first, then try again.");
      return;
    }
    unsent.sort(function(a,b){ return a.updatedAt-b.updatedAt; });
    var body = unsent.map(reportToText).join("\n\n----------\n\n");
    var subject = "Home Visit Reports - "+unsent.length+" unsent report"+(unsent.length===1?"":"s");
    window.location.href = "mailto:"+to+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
    unsent.forEach(function(r){ r.sent=true; r.updatedAt=Date.now(); });
    saveReports();
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveReports(); }, 400);
  }

  function scheduleSearchRender(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      render();
      var el = document.getElementById("search-text");
      if(el){ el.focus(); var len=el.value.length; el.setSelectionRange(len,len); }
    }, 250);
  }

  app.addEventListener("input", function(e){
    var t = e.target;
    if(t.id==="search-text"){ state.search.text = t.value; scheduleSearchRender(); return; }
    var field = t.getAttribute("data-field");
    if(!field || state.view.type!=="form") return;
    if(t.tagName==="TEXTAREA") autoGrow(t);
    if(t.getAttribute("data-mask")==="time"){
      var dg = t.value.replace(/[^0-9]/g,"").slice(0,4);
      t.value = dg.slice(0,2) + (dg.length>2 ? ":"+dg.slice(2) : "");
      t.classList.remove("field-invalid");
    }
    if(t.getAttribute("data-mask")==="date"){
      t.value = formatDateTextInput(t.value);
      t.classList.remove("field-invalid");
      var ag = app.querySelector('[data-age-for="'+field+'"]');
      if(ag){ var at = ageText(t.value); ag.textContent = at ? "\u00b7 "+at : ""; }
    }
    var r = findReport(state.view.reportId);
    if(!r) return;
    r.data[field] = t.value;
    r.updatedAt = Date.now();
    updateDoneButton(r);
    scheduleSave();
  });

  app.addEventListener("focusout", function(e){
    var t = e.target;
    if(t.getAttribute && t.getAttribute("data-mask")==="time"){
      if(t.value && !/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(t.value)){ t.classList.add("field-invalid"); }
      else { t.classList.remove("field-invalid"); }
      return;
    }
    if(t.getAttribute && t.getAttribute("data-mask")==="date"){
      if(t.value && !isValidDateText(t.value)){ t.classList.add("field-invalid"); }
      else { t.classList.remove("field-invalid"); }
      var r = findReport(state.view.reportId);
      if(r) updateDoneButton(r);
    }
  });

  app.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");

    if(action==="stop"){
      return;

    } else if(action==="new-report"){
      var r = { id:newId(), createdAt:Date.now(), updatedAt:Date.now(), sent:false, data:{ date:todayISO() } };
      r.baseline = JSON.stringify(r.data);
      state.reports.push(r);
      saveReports();
      state.view = { type:"form", reportId:r.id, returnTo:{type:"clients"} };
      render();

    } else if(action==="new-visit-for-client"){
      var key = el.getAttribute("data-key");
      var prevList = reportsForClientKey(key);
      var prev = prevList[0];
      var data = { date: todayISO() };
      if(prev){ CARRY_FORWARD.forEach(function(k){ if(prev.data[k]) data[k]=prev.data[k]; }); }
      var nr = { id:newId(), createdAt:Date.now(), updatedAt:Date.now(), sent:false, data:data };
      nr.baseline = JSON.stringify(nr.data);
      state.reports.push(nr);
      saveReports();
      state.view = { type:"form", reportId:nr.id, returnTo:{type:"client"} };
      render();

    } else if(action==="open-client"){
      state.view = { type:"client", clientKey: el.getAttribute("data-key") };
      render();

    } else if(action==="open-report"){
      state.view = { type:"form", reportId:id, returnTo:{type:"client"} };
      render();

    } else if(action==="back-to-clients"){
      state.view = { type:"clients" };
      render();

    } else if(action==="back-from-form"){
      var rpt = findReport(state.view.reportId);
      if(rpt && isReportUnchanged(rpt)){
        state.reports = state.reports.filter(function(r){ return r.id!==rpt.id; });
        saveReports();
        state.view = { type:"clients" };
        render();
        return;
      }
      if(rpt) delete rpt.baseline;
      saveReports();
      var rt = state.view.returnTo || {type:"clients"};
      if(rt.type==="client" && rpt){
        state.view = { type:"client", clientKey: clientKeyFor(rpt) };
      } else {
        state.view = { type:"clients" };
      }
      render();

    } else if(action==="finish-form"){
      var rpt3 = findReport(state.view.reportId);
      if(rpt3) delete rpt3.baseline;
      saveReports();
      var rt3 = state.view.returnTo || {type:"clients"};
      if(rt3.type==="client" && rpt3){
        state.view = { type:"client", clientKey: clientKeyFor(rpt3) };
      } else {
        state.view = { type:"clients" };
      }
      render();

    } else if(action==="open-map"){
      var addr = el.getAttribute("data-address");
      if(!addr){
        var mapField = el.getAttribute("data-field");
        var inp = mapField ? app.querySelector('input[data-field="'+mapField+'"]') : null;
        addr = inp ? inp.value : "";
      }
      if(addr){ window.open("https://maps.apple.com/?q="+encodeURIComponent(addr), "_blank"); }

    } else if(action==="ask-delete"){
      state.confirmDeleteId = id;
      render();

    } else if(action==="cancel-delete"){
      state.confirmDeleteId = null;
      render();

    } else if(action==="confirm-delete"){
      var delId = state.confirmDeleteId;
      state.reports = state.reports.filter(function(r){ return r.id!==delId; });
      saveReports();
      state.confirmDeleteId = null;
      if(state.view.type==="client" && reportsForClientKey(state.view.clientKey).length===0){
        state.view = { type:"clients" };
      }
      render();

    } else if(action==="mail-report"){
      mailReport(id);
      render();

    } else if(action==="mail-unsent"){
      mailAllUnsent();
      render();

    } else if(action==="time-now"){
      var field = el.getAttribute("data-field");
      var rep2 = findReport(state.view.reportId);
      var val = nowHM();
      rep2.data[field] = val;
      rep2.updatedAt = Date.now();
      var input = app.querySelector('input[data-field="'+field+'"]');
      if(input) input.value = val;
      updateDoneButton(rep2);
      scheduleSave();

    } else if(action==="open-settings"){
      state.settingsOpen = true;
      render();

    } else if(action==="cancel-settings"){
      state.settingsOpen = false;
      render();

    } else if(action==="set-theme"){
      state.settings.theme = el.getAttribute("data-value");
      saveSettings();
      applyTheme();
      render();

    } else if(action==="set-textsize"){
      state.settings.textSize = el.getAttribute("data-value");
      saveSettings();
      applyTheme();
      render();

    } else if(action==="toggle-mailed"){
      state.showMailed = !state.showMailed;
      render();

    } else if(action==="backup-now"){
      backupNow();

    } else if(action==="save-settings"){
      state.settings.email1 = document.getElementById("settings-email1").value.trim();
      state.settings.email2 = document.getElementById("settings-email2").value.trim();
      saveSettings();
      state.settingsOpen = false;
      render();
    }
  });

  document.addEventListener("click", function(){
    try{ if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().then(function(ok){ persistState = ok; }); } }catch(e){}
  }, {once:true});

  app.addEventListener("change", function(e){
    if(e.target && e.target.id==="restore-file" && e.target.files && e.target.files[0]){ restoreFrom(e.target.files[0]); }
  });

  (function(){
    var sx=0, sy=0, tracking=false;
    document.addEventListener("touchstart", function(e){
      var t=e.touches[0]; sx=t.clientX; sy=t.clientY;
      tracking = sx < window.innerWidth*0.3 && !document.querySelector(".overlay") &&
        !(e.target===document.activeElement && /input|textarea/i.test(e.target.tagName||""));
    }, {passive:true});
    document.addEventListener("touchend", function(e){
      if(!tracking) return; tracking=false;
      var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
      if(dx>80 && Math.abs(dy)<dx/2){
        var b=document.querySelector('[data-action="back-from-form"],[data-action="back-to-clients"]');
        if(b) b.click();
      }
    }, {passive:true});
  })();

  if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }

  initStorage(function(){
    storeGet("reports", function(v){
      state.reports = v || [];
      storeGet("settings", function(s){
        state.settings = s || {};
        state.settings.email1 = state.settings.email1 || "";
        state.settings.email2 = state.settings.email2 || "";
        state.settings.theme = state.settings.theme || "system";
        state.settings.textSize = state.settings.textSize || "default";
        applyTheme();
        render();
      });
    });
  });
})();
</script>
</body>
</html>
